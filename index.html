<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">r/verify</div>

  <div class="search">
    <input type="text" placeholder="Search verification logs..." />
  </div>

  <div class="right">
    <div class="icon">⟳</div>
    <div class="icon">🔔</div>
    <div class="avatar"></div>
  </div>
</div>

<!-- CAPTCHA OVERLAY -->
<div class="captcha" id="captcha">

  <!-- STEP 1 -->
  <div id="captchaStep1" class="captcha-box">
    <div class="box" id="checkBox"></div>
    <span>I’m not a robot</span>
  </div>

  <!-- STEP 2 -->
  <div id="captchaStep2" class="captcha-challenge">
    <div class="challenge-title">Select all cars</div>

    <div class="grid">
      <div class="tile" data-type="car">🚗</div>
      <div class="tile" data-type="tree">🌳</div>
      <div class="tile" data-type="car">🚙</div>
      <div class="tile" data-type="house">🏠</div>
      <div class="tile" data-type="car">🚕</div>
      <div class="tile" data-type="cat">🐱</div>
    </div>

    <button id="verifyBtn">Verify</button>
  </div>

</div>

<!-- MAIN UI -->
<div class="main" id="main">

  <!-- STEP TEXT -->
  <div id="stage"></div>

  <!-- PROGRESS BAR -->
  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <!-- PERCENT -->
  <div id="percent">0%</div>

  <!-- STEP INDICATOR -->
  <div id="stepInfo"></div>

  <!-- FAIL / TROLL SCREEN -->
  <div class="troll" id="troll"> You've been trolled lol</div>

</div>

<script src="script.js"></script>
</body>
</html>
