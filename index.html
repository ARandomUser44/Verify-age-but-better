<!DOCTYPE html>
<html>
<head>
  <title>Verify Age</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .main {
      text-align: center;
      width: 320px;
      display: none;
    }

    #stage {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0 5px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
    }

    #percent {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .troll {
      display: none;
      font-size: 28px;
      color: #ff4d4d;
    }

    #dots {
      display: inline-block;
      width: 20px;
    }

    .captcha {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #ccc;
      cursor: pointer;
      user-select: none;
    }

    .box {
      width: 18px;
      height: 18px;
      border: 2px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box.checked {
      background: #4caf50;
      border-color: #4caf50;
    }

    .box.checked::after {
      content: "✔";
      color: white;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- CAPTCHA -->
  <div class="captcha" id="captcha">
    <div class="box" id="checkBox"></div>
    <span>I’m not a robot</span>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">

    <div id="stage">Verifying your age<span id="dots"></span></div>

    <div class="bar" id="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div id="percent">0%</div>

    <div class="troll" id="troll"> You've been trolled lol</div>

  </div>

<script>
const steps = [
  "Verifying your age",
  "Checking device integrity",
  "Scanning security protocols",
  "Completing age check"
];

let stepIndex = 0;
let progress = 0;
let interval = null;

const checkBox = document.getElementById("checkBox");
const captcha = document.getElementById("captcha");
const main = document.getElementById("main");

const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const stage = document.getElementById("stage");
const troll = document.getElementById("troll");
const dots = document.getElementById("dots");
const bar = document.getElementById("bar");

let dotState = 0;
let started = false;

/* dots animation */
setInterval(() => {
  if (!started) return;
  dotState = (dotState + 1) % 4;
  dots.textContent = ".".repeat(dotState);
}, 400);

function runStep() {

  /* CAPTCHA STEP */
  if (stepIndex === 3) {
    stage.textContent = "";
    stage.appendChild(dots);

    bar.style.display = "none";
    percent.style.display = "none";

    captcha.style.display = "flex";
    return;
  }

  bar.style.display = "block";
  percent.style.display = "block";

  progress = 0;
  fill.style.width = "0%";
  percent.textContent = "0%";

  stage.textContent = steps[stepIndex];
  stage.appendChild(dots);

  interval = setInterval(() => {
    progress += 2;

    fill.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress >= 100) {
      clearInterval(interval);
      stepIndex++;

      if (stepIndex < steps.length) {
        setTimeout(runStep, 500);
      } else {
        runFinalStage();
      }
    }
  }, 30);
}

/* FINAL STAGE */
function runFinalStage() {
  setTimeout(() => {
    let finalProgress = 99;

    fill.style.width = "99%";
    percent.textContent = "99%";

    let drop = setInterval(() => {
      finalProgress -= 1;

      fill.style.width = finalProgress + "%";
      percent.textContent = finalProgress + "%";

      if (finalProgress <= 30) {
        clearInterval(drop);

        stage.style.display = "none";
        bar.style.display = "none";
        percent.style.display = "none";
        troll.style.display = "block";
      }
    }, 60);

  }, 2000);
}

/* CAPTCHA CLICK */
checkBox.addEventListener("click", () => {
  checkBox.classList.add("checked");

  setTimeout(() => {
    captcha.style.display = "none";
    stepIndex++;
    runStep();
  }, 600);
});

/* START */
main.style.display = "block";
started = true;
runStep();
</script>

</body>
</html>
