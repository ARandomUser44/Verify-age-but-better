<!DOCTYPE html>
<html>
<head>
  <title>Verifying...</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      text-align: center;
      width: 320px;
    }

    #stage {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0 5px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s;
    }

    #percent {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .troll {
      display: none;
      font-size: 28px;
      color: #ff4d4d;
    }

    #dots {
      display: inline-block;
      width: 20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div id="stage">Verifying your age<span id="dots"></span></div>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div id="percent">0%</div>

    <div class="troll" id="troll">😂 You've been trolled lol</div>
  </div>

  <script>
    const dots = document.getElementById("dots");
    const fill = document.getElementById("fill");
    const percent = document.getElementById("percent");
    const stage = document.getElementById("stage");
    const troll = document.getElementById("troll");

    let dotState = 0;
    let progress = 0;

    const stages = [
      "Verifying your age",
      "Checking device integrity",
      "Scanning security protocols",
      "Completing age check"
    ];

    let stageIndex = 0;

    // dots animation
    const dotInterval = setInterval(() => {
      dotState = (dotState + 1) % 4;
      dots.textContent = ".".repeat(dotState);
    }, 400);

    // progress logic
    const progressInterval = setInterval(() => {
      if (progress < 99) {
        progress += 2;

        if (progress > 99) progress = 99;

        fill.style.width = progress + "%";
        percent.textContent = progress + "%";

        // change stage text occasionally
        if (progress % 25 === 0 && stageIndex < stages.length - 1) {
          stageIndex++;
          stage.textContent = stages[stageIndex];
          stage.appendChild(dots);
        }
      } 
      else {
        // stuck at 99%
        percent.textContent = "99%";
        fill.style.width = "99%";

        clearInterval(progressInterval);
        clearInterval(dotInterval);

        // drop back to 80%
        setTimeout(() => {
          let drop = 99;

          const dropInterval = setInterval(() => {
            drop -= 1;
            fill.style.width = drop + "%";
            percent.textContent = drop + "%";

            if (drop <= 80) {
              clearInterval(dropInterval);

              // wait then troll
              setTimeout(() => {
                stage.style.display = "none";
                document.querySelector(".bar").style.display = "none";
                percent.style.display = "none";
                troll.style.display = "block";
              }, 3000);
            }
          }, 50);

        }, 3000);
      }
    }, 80);
  </script>
</body>
</html>
