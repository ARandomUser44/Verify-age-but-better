<!DOCTYPE html>
<html>
<head>
  <title>Verifying...</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      text-align: center;
      width: 320px;
    }

    #stage {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0 5px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.2s;
    }

    #percent {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .troll {
      display: none;
      font-size: 28px;
      color: #ff4d4d;
    }

    #dots {
      display: inline-block;
      width: 20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div id="stage">Verifying your age<span id="dots"></span></div>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div id="percent">0%</div>

    <div class="troll" id="troll">😂 You've been trolled lol</div>
  </div>

  <script>
    const dots = document.getElementById("dots");
    const fill = document.getElementById("fill");
    const percent = document.getElementById("percent");
    const stage = document.getElementById("stage");
    const troll = document.getElementById("troll");

    const steps = [
      "Verifying your age",
      "Checking device integrity",
      "Scanning security protocols",
      "Completing age check"
    ];

    let stepIndex = 0;
    let progress = 0;

    // dots animation
    let dotState = 0;
    setInterval(() => {
      dotState = (dotState + 1) % 4;
      dots.textContent = ".".repeat(dotState);
    }, 400);

    function runStep() {
      progress = 0;
      fill.style.width = "0%";
      percent.textContent = "0%";
      stage.textContent = steps[stepIndex];
      stage.appendChild(dots);

      let interval = setInterval(() => {
        progress += 2;

        fill.style.width = progress + "%";
        percent.textContent = progress + "%";

        if (progress >= 100) {
          clearInterval(interval);

          stepIndex++;

          if (stepIndex < steps.length) {
            setTimeout(runStep, 500);
          } else {
            // final troll
            setTimeout(() => {
              stage.style.display = "none";
              document.querySelector(".bar").style.display = "none";
              percent.style.display = "none";
              troll.style.display = "block";
            }, 500);
          }
        }
      }, 30);
    }

    runStep();
  </script>
</body>
</html>
