<!DOCTYPE html>
<html>
<head>
  <title>Verifying...</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      text-align: center;
      font-size: 24px;
    }

    .troll {
      display: none;
      font-size: 28px;
      color: #ff4d4d;
      margin-top: 10px;
    }

    #stage {
      opacity: 1;
      transition: opacity 0.5s;
    }
  </style>
</head>

<body>
  <div class="box">
    <div id="stage">Verifying your age<span id="dots"></span></div>
    <div class="troll" id="troll">😂 You've been trolled lol</div>
  </div>

  <script>
    const dots = document.getElementById("dots");
    const stage = document.getElementById("stage");
    const troll = document.getElementById("troll");

    const stages = [
      "Verifying your age",
      "Checking device integrity",
      "Scanning security protocols",
      "Finalizing secure session"
    ];

    let dotState = 0;
    let stageIndex = 0;

    // dots animation
    const dotInterval = setInterval(() => {
      dotState = (dotState + 1) % 4;
      dots.textContent = ".".repeat(dotState);
    }, 400);

    // stage switching
    const stageInterval = setInterval(() => {
      stageIndex++;

      if (stageIndex < stages.length) {
        stage.style.opacity = 0;

        setTimeout(() => {
          stage.textContent = stages[stageIndex];
          stage.appendChild(dots);
          stage.style.opacity = 1;
        }, 300);
      }
    }, 1200);

    // final reveal
    setTimeout(() => {
      clearInterval(dotInterval);
      clearInterval(stageInterval);

      stage.style.display = "none";
      troll.style.display = "block";
    }, 6000);
  </script>
</body>
</html>
