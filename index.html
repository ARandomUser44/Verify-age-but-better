<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #1a1a1b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #2c2c2c;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      color: #ff4d4d;
      font-size: 14px;
    }

    .search input {
      width: 50vw;
      max-width: 420px;
      background: #272729;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 6px 12px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon {
      color: #bbb;
      font-size: 15px;
      cursor: pointer;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff4d4d, #4caf50);
    }

    /* ===== MAIN ===== */
    .main {
      margin-top: 100px;
      text-align: center;
      width: 340px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .main.show {
      opacity: 1;
    }

    #stage {
      font-size: 20px;
      margin-bottom: 12px;
      min-height: 24px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.1s linear;
    }

    #percent {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .troll {
      display: none;
      font-size: 26px;
      color: #ff4d4d;
    }

    /* ===== CAPTCHA ===== */
    .captcha {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
    }

    .captcha-box {
      background: #1a1a1a;
      padding: 18px 22px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      color: #ccc;
    }

    .box {
      width: 18px;
      height: 18px;
      border: 2px solid #777;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box.checked {
      background: #4caf50;
      border-color: #4caf50;
    }

    .box.checked::after {
      content: "✔";
      font-size: 12px;
      color: white;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">r/verify</div>

  <div class="search">
    <input type="text" placeholder="Search verification logs..." />
  </div>

  <div class="right">
    <div class="icon">⟳</div>
    <div class="icon">🔔</div>
    <div class="avatar"></div>
  </div>
</div>

<!-- CAPTCHA -->
<div class="captcha" id="captcha">
  <div class="captcha-box">
    <div class="box" id="checkBox"></div>
    <span>I’m not a robot</span>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <div id="stage"></div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div id="percent"></div>

  <div class="troll" id="troll"> you've been trolled lol</div>

</div>

<script>
const steps = [
  "Verifying system identity",
  "Checking device integrity",
  "Scanning security protocols",
  "Captcha verification",
  "Finalizing request"
];

let step = 0;
let progress = 0;
let retry = 0;
const maxRetries = 2;
let firstRetry = true;

const main = document.getElementById("main");
const stage = document.getElementById("stage");
const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const troll = document.getElementById("troll");

const captcha = document.getElementById("captcha");
const checkBox = document.getElementById("checkBox");

/* SET PROGRESS */
function setProgress(p) {
  progress = p;
  fill.style.width = p + "%";
  percent.textContent = Math.floor(p) + "%";
}

/* NORMAL STEPS */
function runStep() {
  if (step === steps.length - 1) return runFinal();

  stage.textContent = steps[step];

  let p = 0;

  const tick = setInterval(() => {
    p += Math.random() * 2.2;
    setProgress(p);

    if (p >= 100) {
      clearInterval(tick);
      step++;

      if (steps[step] === "Captcha verification") {
        showCaptcha();
        return;
      }

      setTimeout(runStep, 250);
    }
  }, 30);
}

/* CAPTCHA */
function showCaptcha() {
  captcha.style.display = "flex";
}

checkBox.addEventListener("click", () => {
  checkBox.classList.add("checked");

  setTimeout(() => {
    captcha.style.display = "none";
    step++;
    runStep();
  }, 600);
});

/* FINAL */
function runFinal() {
  stage.textContent = "Finalizing request";

  let p = 0;

  const rise = setInterval(() => {
    p += Math.random() * 1.4;
    setProgress(p);

    if (p >= 99) {
      clearInterval(rise);
      setTimeout(retryLoop, 1200);
    }
  }, 30);
}

/* RETRY */
function retryLoop() {
  if (retry >= maxRetries) return fail();

  retry++;

  stage.textContent = "Error retrying";
  stage.style.color = "#ff4d4d";

  if (firstRetry) {
    firstRetry = false;
    setProgress(0);
    setTimeout(retryLoop, 700);
    return;
  }

  let p = progress;

  const drop = setInterval(() => {
    p -= 2;
    setProgress(p);

    if (p <= 70) {
      clearInterval(drop);

      const rise = setInterval(() => {
        p += 2;
        setProgress(p);

        if (p >= 99) {
          clearInterval(rise);
          setTimeout(retryLoop, 800);
        }
      }, 30);
    }
  }, 30);
}

/* END */
function fail() {
  let p = progress;

  const drop = setInterval(() => {
    p -= 1;
    setProgress(p);

    if (p <= 30) {
      clearInterval(drop);

      stage.style.display = "none";
      document.querySelector(".bar").style.display = "none";
      percent.style.display = "none";
      troll.style.display = "block";
    }
  }, 60);
}

/* INIT */
main.classList.add("show");
stage.textContent = steps[0];
runStep();
</script>

</body>
</html>
