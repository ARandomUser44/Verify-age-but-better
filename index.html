<!DOCTYPE html>
<html>
<head>
  <title>Verify Age</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .main {
      text-align: center;
      width: 320px;
      display: none;
    }

    #stage {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0 5px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
    }

    #percent {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .troll {
      display: none;
      font-size: 28px;
      color: #ff4d4d;
    }

    #dots {
      display: inline-block;
      width: 20px;
      color: white;
    }

    .captcha {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #ccc;
      cursor: pointer;
      user-select: none;
    }

    .box {
      width: 18px;
      height: 18px;
      border: 2px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box.checked {
      background: #4caf50;
      border-color: #4caf50;
    }

    .box.checked::after {
      content: "✔";
      color: white;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="captcha" id="captcha">
  <div class="box" id="checkBox"></div>
  <span>I’m not a robot</span>
</div>

<div class="main" id="main">

  <div id="stage">Verifying your age<span id="dots"></span></div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div id="percent">0%</div>

  <div class="troll" id="troll"> You've been trolled lol</div>

</div>

<script>
const steps = [
  "Verifying your age",
  "Checking device integrity",
  "Scanning security protocols",
  "I’m not a robot",
  "Completing age check"
];

let stepIndex = 0;
let progress = 0;
let interval = null;

let retryCount = 0;
const maxRetries = 2;
let firstRetry = true;

const checkBox = document.getElementById("checkBox");
const captcha = document.getElementById("captcha");
const main = document.getElementById("main");

const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const stage = document.getElementById("stage");
const troll = document.getElementById("troll");
const dots = document.getElementById("dots");

let dotState = 0;
let started = false;

/* animated dots */
setInterval(() => {
  if (!started) return;
  dotState = (dotState + 1) % 4;
  dots.textContent = ".".repeat(dotState);
}, 400);

function runStep() {
  progress = 0;
  fill.style.width = "0%";
  percent.textContent = "0%";

  percent.style.display = "block";
  document.querySelector(".bar").style.display = "block";
  stage.style.display = "block";

  stage.style.color = "white";
  dots.style.color = "white";

  stage.textContent = steps[stepIndex];
  stage.appendChild(dots);

  if (steps[stepIndex] === "I’m not a robot") {
    document.querySelector(".bar").style.display = "none";
    percent.style.display = "none";
    stage.style.display = "none";
    captcha.style.display = "flex";
    return;
  }

  if (stepIndex === steps.length - 1) {
    runFinalStage();
    return;
  }

  interval = setInterval(() => {
    progress += 2;
    fill.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress >= 100) {
      clearInterval(interval);
      stepIndex++;
      setTimeout(runStep, 300);
    }
  }, 30);
}

/* FINAL STAGE */
function runFinalStage() {
  progress = 0;

  stage.style.color = "white";
  dots.style.color = "white";

  stage.textContent = "Completing age check";
  stage.appendChild(dots);

  interval = setInterval(() => {
    progress += 1;
    fill.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress >= 99) {
      clearInterval(interval);
      setTimeout(retryLoop, 1200);
    }
  }, 30);
}

/* RETRY SYSTEM */
function retryLoop() {
  if (retryCount >= maxRetries) {
    finalTroll();
    return;
  }

  retryCount++;

  stage.textContent = "Error retrying";
  stage.style.color = "#ff4d4d";
  dots.style.color = "#ff4d4d";

  /* first retry instantly resets */
  if (firstRetry) {
    firstRetry = false;
    progress = 0;
    fill.style.width = "0%";
    percent.textContent = "0%";

    setTimeout(() => retryLoop(), 700);
    return;
  }

  let drop = setInterval(() => {
    progress -= 2;
    fill.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress <= 70) {
      clearInterval(drop);

      let rise = setInterval(() => {
        progress += 2;
        fill.style.width = progress + "%";
        percent.textContent = progress + "%";

        if (progress >= 99) {
          clearInterval(rise);
          setTimeout(retryLoop, 800);
        }
      }, 30);
    }
  }, 30);
}

function finalTroll() {
  let drop = setInterval(() => {
    progress -= 1;
    fill.style.width = progress + "%";
    percent.textContent = progress + "%";

    if (progress <= 30) {
      clearInterval(drop);

      stage.style.display = "none";
      document.querySelector(".bar").style.display = "none";
      percent.style.display = "none";
      troll.style.display = "block";
    }
  }, 60);
}

/* CAPTCHA */
checkBox.addEventListener("click", () => {
  checkBox.classList.add("checked");

  setTimeout(() => {
    captcha.style.display = "none";

    document.querySelector(".bar").style.display = "block";
    percent.style.display = "block";
    stage.style.display = "block";

    stepIndex++;
    runStep();
  }, 500);
});

/* START */
main.style.display = "block";
started = true;
runStep();
</script>

</body>
</html>
